# Matrix MPC skin layout: 4 x 2 large controls per tab on the grid of mpc-vst-rattler / mpc-vst-ccmap
# (r=48), in the order of the Force's eight Q-Links. The step grid itself is on the iPad/phone (shared
# Force hub, PHONE VIEW); the skin holds the transport (PATTERN, SWING, GATE), the kit (TRACK tab:
# note, channel, length, mute, solo of the track chosen with TRACK) and the 32 presets.
# Labels: popups and readouts carry their text in caption="..." (label "-"); captions.py draws them
# in Titillium Web at the knob names' size. Palette: graphite panel, warm white print, matrix green.
style=td3
theme_bg=1c1e22
theme_panel=2a2d33
theme_line=121316
theme_ink=f0ece4
theme_ink_dim=aaa69c
theme_ink_faint=62605a
theme_accent=3ccf8e
theme_accent_hi=8ef0c0
theme_knob_face=121316
theme_knob_ring=000000
theme_bar=3ccf8e
theme_seg_active=3ccf8e
theme_seg_inactive=121316
theme_seg_active_tx=141414
theme_btn_text=141414
theme_well=0e0f11
theme_knob_off=4c4f56
theme_tab_on=3ccf8e
theme_tab_on_tx=141414
theme_lcd=0b0c0e
theme_box=202227
theme_btn_bg=f0ece4
theme_chrome_ink=f0ece4
theme_go_on=3ccf8e
theme_go_off=8ef0c0
theme_tabs=3ccf8e


[tab MAIN]
frame x=36 y=88 w=1207 h=624 title=""
knob cx=190 cy=250 r=48 label="PATTERN" key=pattern
knob cx=490 cy=250 r=48 label="SWING" key=swing
knob cx=790 cy=250 r=48 label="GATE" key=gate
knob cx=1090 cy=250 r=48 label="TAP VELOCITY" key=tap_vel
readout cx=340 cy=530 w=560 h=48 label="-" caption="STATUS" key=status
readout cx=940 cy=530 w=560 h=48 label="-" caption="TRACK STEPS 1-16" key=steps
qlinks "MAIN" = pattern,swing,gate,tap_vel

[tab TRACK]
frame x=36 y=88 w=1207 h=624 title=""
knob cx=190 cy=250 r=48 label="TRACK" key=track
knob cx=490 cy=250 r=48 label="NOTE" key=note
knob cx=790 cy=250 r=48 label="CHANNEL" key=channel
knob cx=1090 cy=250 r=48 label="LENGTH" key=length
popup cx=190 cy=530 w=220 h=48 label="-" caption="MUTE" key=mute
popup cx=490 cy=530 w=220 h=48 label="-" caption="SOLO" key=solo
button cx=790 cy=540 label="LEARN NOTE" key=learn
button cx=1090 cy=540 label="CLEAR TRACK" key=clear
qlinks "TRACK" = track,note,channel,length,mute,solo,learn,clear

[tab SETUP]
frame x=36 y=88 w=1207 h=624 title=""
knob cx=190 cy=250 r=48 label="CONTROL CH" key=ctl_ch
popup cx=490 cy=250 w=220 h=48 label="-" caption="PHONE VIEW" key=web
readout cx=940 cy=250 w=460 h=48 label="-" caption="OPEN ON PHONE: HTTP://" key=web_addr
readout cx=640 cy=530 w=1000 h=48 label="-" caption="STATUS" key=status
qlinks "SETUP" = ctl_ch,web

[tab PRESET]
frame x=36 y=88 w=1207 h=624 title=""
button cx=340 cy=390 label="LOAD" key=load
knob cx=640 cy=380 r=48 label="PRESET" key=preset
button cx=940 cy=390 label="SAVE" key=save
qlinks "PRESET" = preset,load,save
